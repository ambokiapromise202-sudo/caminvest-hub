function render(list){
 let g=document.getElementById('carGrid'); g.innerHTML="";
 list.forEach(c=>{
  g.innerHTML+=`

      <p class="text-green-600 font-black text-sm">${c.price} FCFA</p>
      <p class="text-[9px] text-blue-600 mt-1">📹 Video + Documents - Google Indexed</p>
    </div>
  </div>`;
 });
}

function openCar(id){
 let c=cars.find(x=>x.id==id);
 // Google JSON-LD for this car - makes Google show price in search
 let jsonLd = {
  "@context":"https://schema.org",
  "@type":"Vehicle",
  "name": c.name,
  "image": c.img,
  "offers": {"@type":"Offer","price": c.price, "priceCurrency":"XAF", "availability":"https://schema.org/InStock"},
  "mileageFromOdometer": c.km
 };
 document.getElementById('detailContent').innerHTML=`

    <span class="bg-gray-200 px-2 py-1 rounded-full">Lights</span>

   </div>

   </div>

   <div class="mt-4">

    <p class="text-xs mt-1">✅ Carte Grise ✅ Visite Technique ✅ Assurance ✅ Dédouané</p>
   </div>

   <div class="mt-6 bg-yellow-50 border-2 border-yellow-400 p-4 rounded-2xl">
    <h3 class="font-black">💳 Deposit with 10 methods</h3>
    <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
     <button class="bg-yellow-400 p-2 rounded-lg">MTN MoMo</button>
     <button class="bg-orange-500 text-white p-2 rounded-lg">Orange Money</button>
     <button class="bg-blue-600 text-white p-2 rounded-lg">Express Union</button>

    </div>
    <button class="w-full bg-black text-white py-3 rounded-xl mt-3 font-bold">PAY 50,000 DEPOSIT & RESERVE</button>
   </div>

   <script type="application/ld+json">${JSON.stringify(jsonLd)}<\/script>
  </div>
 `;
 document.getElementById('detail').classList.remove('hidden');
 // Change URL so Google can index each car separately:?car=ID
 window.history.pushState({}, '', '?car='+c.id+'&name='+encodeURIComponent(c.name.replace(/\s+/g,'-'))+'-Buea');
}
function closeDetail(){ document.getElementById('detail').classList.add('hidden'); window.history.pushState({}, '', window.location.pathname); }
function filterCars(){ let q=document.getElementById('search').value.toLowerCase(); render(cars.filter(c=>c.name.toLowerCase().includes(q))); }
render(cars);
</script>
</body>
