<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamInvest Hub</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:#fff;padding:15px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin:10px 0}
input,select,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:0;font-size:16px}
button{background:#00ff88;color:#000;font-weight:bold}
button:disabled{background:#555}
.balance{font-size:32px;color:#00ff88;font-weight:bold;text-align:center}
.row{display:flex;gap:10px}
.row button{flex:1}
.admin{background:#ff44441a;border:1px solid #ff4444}
.hidden{display:none}
</style>
</head>
<body>

<div id="auth">
  <div class="card">
    <h2>CamInvest Hub</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <input id="name" placeholder="Full Name (for signup)">
    <button onclick="login()">Login</button>
    <button onclick="signup()" style="background:#333;color:#fff">Create Account</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="card">
    <p>Welcome, <span id="userName"></span></p>
    <div class="balance"><span id="bal">0</span> F</div>
    <p style="text-align:center;opacity:.7">Daily Profit: 10%</p>
    <div class="row">
      <button onclick="show('deposit')">Deposit</button>
      <button onclick="show('withdraw')" style="background:#fff">Withdraw</button>
    </div>
    <button onclick="logout()" style="background:#333;color:#fff;margin-top:10px">Logout</button>
  </div>

  <div id="deposit" class="card hidden">
    <h3>Deposit</h3>
    <input id="depAmount" type="number" placeholder="Amount e.g 1000">
    <select id="depMethod">
      <option>MTN MoMo</option>
      <option>Orange Money</option>
    </select>
    <input id="depPhone" placeholder="Your MoMo Number">
    <p style="font-size:13px;opacity:.7">Send to: 650000000 - Ambokia Promise<br>After sending, click below</p>
    <button onclick="doDeposit()">I HAVE SENT - CREDIT ME</button>
  </div>

  <div id="withdraw" class="card hidden">
    <h3>Withdraw</h3>
    <input id="withAmount" type="number" placeholder="Amount">
    <input id="withPhone" placeholder="MoMo Number to receive">
    <button onclick="doWithdraw()">Request Withdrawal</button>
  </div>

  <div id="admin" class="card admin hidden">
    <h3>ADMIN - Pending</h3>
    <div id="adminList">Loading...</div>
  </div>

  <div class="card">
    <h3>History</h3>
    <div id="history">Loading...</div>
  </div>
</div>

<script>
// === PUT YOUR FIREBASE CONFIG HERE ===
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "caminvest-hub-14129.firebaseapp.com",
  projectId: "caminvest-hub-14129",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

const ADMIN_EMAIL="ambokiapromise@gmail.com"; // CHANGE TO YOUR EMAIL

function show(id){
  document.getElementById('deposit').classList.add('hidden');
  document.getElementById('withdraw').classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
}

auth.onAuthStateChanged(async user=>{
  if(!user){authDiv();return}
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const doc=await db.collection('users').doc(user.uid).get();
  const data=doc.data();
  document.getElementById('userName').innerText=data?.name||user.email;
  document.getElementById('bal').innerText=data?.balance||0;
  
  if(user.email===ADMIN_EMAIL){
    document.getElementById('admin').classList.remove('hidden');
    loadAdmin();
  }
  loadHistory(user.uid);
});

function authDiv(){
  document.getElementById('auth').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}

async function signup(){
  const email=document.getElementById('email').value;
  const pass=document.getElementById('password').value;
  const name=document.getElementById('name').value;
  const cred=await auth.createUserWithEmailAndPassword(email,pass);
  await db.collection('users').doc(cred.user.uid).set({email,name,balance:0,created:Date.now()});
}
async function login(){
  const email=document.getElementById('email').value;
  const pass=document.getElementById('password').value;
  await auth.signInWithEmailAndPassword(email,pass);
}
function logout(){auth.signOut();}

// EASY DEPOSIT - AUTO CREDIT FOR NOW (No admin needed)
async function doDeposit(){
  const amount=parseInt(document.getElementById('depAmount').value);
  const method=document.getElementById('depMethod').value;
  const phone=document.getElementById('depPhone').value;
  if(!amount||amount<500) return alert('Min 500F');
  const user=auth.currentUser;
  // 1. Save deposit record
  await db.collection('deposits').add({userId:user.uid,email:user.email,amount,method,phone,status:'approved',time:Date.now()});
  // 2. INSTANT CREDIT - No waiting!
  await db.collection('users').doc(user.uid).update({balance:firebase.firestore.FieldValue.increment(amount),packageActive:true});
  alert('Deposited! '+amount+'F credited instantly!');
  location.reload();
}

// EASY WITHDRAW
async function doWithdraw(){
  const amount=parseInt(document.getElementById('withAmount').value);
  const phone=document.getElementById('withPhone').value;
  const user=auth.currentUser;
  const userDoc=await db.collection('users').doc(user.uid).get();
  if(userDoc.data().balance < amount) return alert('Insufficient balance');
  await db.collection('withdrawals').add({userId:user.uid,email:user.email,amount,phone,status:'pending',time:Date.now()});
  await db.collection('users').doc(user.uid).update({balance:firebase.firestore.FieldValue.increment(-amount)});
  alert('Withdrawal request sent! You will receive '+amount+'F to '+phone);
  location.reload();
}

async function loadHistory(uid){
  const snap=await db.collection('deposits').where('userId','==',uid).orderBy('time','desc').limit(10).get();
  let h='';
  snap.forEach(d=>{h+=`<div style="padding:8px;border-bottom:1px solid #333">${d.data().amount}F - ${d.data().status} - ${new Date(d.data().time).toLocaleDateString()}</div>`});
  document.getElementById('history').innerHTML=h||'No history';
}

async function loadAdmin(){
  const snap=await db.collection('withdrawals').where('status','==','pending').get();
  let html='';
  snap.forEach(doc=>{
    const d=doc.data();
    html+=`<div style="padding:10px;border:1px solid #555;margin:5px 0">${d.email} - ${d.amount}F to ${d.phone}<br><button onclick="approveW('${doc.id}')">Approve Sent</button></div>`;
  });
  document.getElementById('adminList').innerHTML=html||'No pending withdrawals';
}
async function approveW(id){
  await db.collection('withdrawals').doc(id).update({status:'paid'});
  alert('Marked as paid'); loadAdmin();
}
</script>
</body>
</html>
