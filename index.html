<!-- REAL MOMO USSD RECHARGE MODAL -->
<div id="depModal" class="modal" onclick="if(event.target==this)closeMod()">
<div class="box">
<h4>💳 Recharge REAL MoMo Money</h4>
<small style="color:#00a651">Direct to your MoMo dialer - Auto filled</small>
<input id="depPhone" placeholder="Your MoMo Number e.g 678657567" type="tel">
<input id="depAmount" type="number" value="200" placeholder="Amount Min 200F">
<select id="depMethod">
<option value="mtn">MTN MoMo</option>
<option value="orange">Orange Money</option>
</select>
<div style="background:#e8f5e9;padding:10px;border-radius:8px;font-size:12px;margin:8px 0">
Receiving Account: <b>650000000 - Ambokia</b><br>
After dialing, enter your MoMo PIN to confirm
</div>
<button onclick="doRealMoMoRecharge()" style="width:100%;background:#ffcc00;color:#000;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:14px">📞 SUBMIT & OPEN MOMO DIALER</button>
<button onclick="closeMod()" style="width:100%;background:#eee;padding:10px;border:0;border-radius:8px;margin-top:6px">Cancel</button>
</div>
</div>

<script>
function doRealMoMoRecharge(){
  let myPhone = document.getElementById('depPhone').value.trim();
  let amount = document.getElementById('depAmount').value.trim();
  let method = document.getElementById('depMethod').value;
  
  if(!myPhone || !amount || amount < 200) return alert('Enter phone and amount min 200F');
  
  let receiver = "650000000"; // YOUR NUMBER - Change this!
  
  // Save pending in Firebase
  if(db){
    db.collection('deposits').add({
      phone: myPhone,
      amount: parseInt(amount),
      method: method,
      to: receiver,
      time: Date.now(),
      status: 'USER_DIALED_USSD',
      note: 'User opened dialer to send '+amount+'F'
    });
  }
  addHistory('Recharge Initiated '+amount+'F - Dialing MoMo', 0);
  
  // REAL USSD CODE THAT OPENS DIALER WITH NUMBER + AMOUNT PRE-FILLED
  let ussdCode = "";
  
  if(method === "mtn"){
    // MTN Cameroon: *126*1*1*receiver*amount#
    // This opens dialer: User just needs to press call and enter PIN
    ussdCode = `*126*1*1*${receiver}*${amount}#`;
  } else {
    // Orange Cameroon: #150*1*1*receiver*amount#
    ussdCode = `#150*1*1*${receiver}*${amount}#`;
  }
  
  // This opens phone call app with USSD already typed!
  let telLink = `tel:${encodeURIComponent(ussdCode)}`;
  
  if(confirm(`You are about to send REAL ${amount}F from ${myPhone} to ${receiver}\n\nYour phone dialer will open with:\n${ussdCode}\n\nPress CALL then enter your MoMo PIN\n\nContinue?`)){
    
    // OPEN REAL DIALER
    window.location.href = telLink;
    
    // After 5 seconds, ask for Transaction ID to verify
    setTimeout(()=>{
      let txn = prompt(`After you entered your MoMo PIN and sent ${amount}F to ${receiver}:\n\nEnter the MoMo Transaction ID from the SMS you received to verify and credit your CamInvest balance:`);
      if(txn){
        if(db){
          db.collection('deposits').add({
            phone: myPhone,
            amount: parseInt(amount),
            txnId: txn,
            method: method,
            time: Date.now(),
            status: 'AWAITING_VERIFICATION'
          });
        }
        alert(`✅ Transaction ID ${txn} submitted!\n\nWe will verify your ${amount}F payment and credit your account in 5 minutes!`);
        closeMod();
      }
    }, 8000);
  }
}
</script>
