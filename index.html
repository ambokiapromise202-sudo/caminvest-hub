<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriveSelect - Alibaba of Buea | Buy Anything</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f5] pb-24">

<!-- ALIBABA HEADER -->
<header class="bg-[#FF6A00] text-white p-3 sticky top-0 z-50">
  <div class="flex items-center gap-2">
    <h1 class="font-black text-xl">🛒 BueaMarket</h1>
    <span class="text-xs bg-white text-orange-600 px-2 py-1 rounded-full font-bold">Alibaba of Buea</span>
  </div>
  <div class="flex gap-2 mt-3">
    <input id="search" onkeyup="searchAll()" placeholder="Search anything... car, bumper, light, phone, shoes..." class="w-full p-3 rounded-full text-black text-sm">
    <button class="bg-black px-4 rounded-full text-sm">🔍</button>
  </div>
  <div class="flex gap-2 mt-2 text-[10px] overflow-x-auto">
    <span class="bg-white/20 px-2 py-1 rounded-full">Toyota</span>
    <span class="bg-white/20 px-2 py-1 rounded-full">Buick</span>
    <span class="bg-white/20 px-2 py-1 rounded-full">BMW Parts</span>
    <span class="bg-white/20 px-2 py-1 rounded-full">Head Light</span>
    <span class="bg-white/20 px-2 py-1 rounded-full">Bumper</span>
    <span class="bg-white/20 px-2 py-1 rounded-full">Fender</span>
    <span class="bg-white/20 px-2 py-1 rounded-full">Engine</span>
  </div>
</header>

<!-- CATEGORIES LIKE ALIBABA -->
<div class="bg-white p-3 grid grid-cols-5 gap-2 text-[10px] text-center">
  <div onclick="filterCat('cars')"><div class="text-2xl">🚗</div>Cars</div>
  <div onclick="filterCat('parts')"><div class="text-2xl">🔧</div>Parts</div>
  <div onclick="filterCat('light')"><div class="text-2xl">💡</div>Lights</div>
  <div onclick="filterCat('bumper')"><div class="text-2xl">🛡️</div>Bumper</div>
  <div onclick="filterCat('engine')"><div class="text-2xl">⚙️</div>Engine</div>
</div>

<!-- PRODUCTS GRID - LIKE ALIBABA -->
<div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-2 p-2 max-w-7xl mx-auto"></div>

<!-- PRODUCT DETAIL - ALIBABA STYLE -->
<div id="detail" class="fixed inset-0 bg-white z-50 overflow-y-auto hidden">
  <button onclick="closeDetail()" class="fixed top-3 left-3 bg-black text-white w-10 h-10 rounded-full z-50">✕</button>
  <div id="detailBox" class="max-w-4xl mx-auto pb-32"></div>
</div>

<!-- CART / FUNDS -->
<div id="cartBar" class="fixed bottom-16 left-0 right-0 bg-black text-white p-3 flex justify-between items-center z-40 hidden">
  <span class="text-sm"><span id="cartCount">0</span> items | <span id="cartTotal">0 FCFA</span></span>
  <button onclick="openCheckout()" class="bg-[#FF6A00] px-6 py-2 rounded-full font-bold">Checkout (10 Pay Methods)</button>
</div>

<!-- BOTTOM MENU - Alibaba style Home / Funds / Deposit / Rejoin / Me -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 text-[10px] z-50">
  <button onclick="showHome()" class="flex flex-col items-center text-[#FF6A00]"><span class="text-xl">🏠</span>Home</button>
  <button onclick="openFunds()" class="flex flex-col items-center"><span class="text-xl">💰</span>Funds</button>
  <button onclick="openDeposit()" class="flex flex-col items-center"><span class="text-xl">💳</span>Deposit</button>
  <button onclick="openRejoin()" class="flex flex-col items-center"><span class="text-xl">🔗</span>Rejoin</button>
  <button onclick="openMe()" class="flex flex-col items-center"><span class="text-xl">👤</span>Me</button>
</div>

<script>
// ALIBABA PRODUCTS - DIFFERENT DIFFERENT, NOT SAME
const products = [
 {id:1, cat:"cars", name:"Toyota Corolla 2010 LE - Clean", price:3500000, img:"https://images.unsplash.com/photo-1590362891991-f776e747a588?w=400", supplier:"Molyko Auto Garage", location:"Molyko, Buea", sales:120, video:"yes"},
 {id:2, cat:"cars", name:"Buick Encore 2015 SUV - Full Option", price:4800000, img:"https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=400", supplier:"Checkpoint Auto", location:"Checkpoint", sales:89, video:"yes"},
 {id:3, cat:"parts", name:"Toyota Corolla Head Light - Original", price:45000, img:"https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=400", supplier:"Molyko Pieces Auto", location:"Molyko", sales:340, video:"no"},
 {id:4, cat:"bumper", name:"BMW X5 Front Bumper 2012", price:120000, img:"https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400", supplier:"Mile 17 Parts", location:"Mile 17", sales:56, video:"no"},
 {id:5, cat:"light", name:"Buick LaCrosse Tail Light", price:60000, img:"https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=400", supplier:"Great Soppo Garage", location:"Soppo", sales:102, video:"no"},
 {id:6, cat:"engine", name:"Toyota 1ZZ Engine - Complete", price:850000, img:"https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=400", supplier:"Molyko Engine Shop", location:"Molyko", sales:23, video:"yes"},
 {id:7, cat:"cars", name:"Mercedes C300 2013 - Leather", price:7200000, img:"https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=400", supplier:"Molyko Main", location:"Molyko", sales:45, video:"yes"},
 {id:8, cat:"parts", name:"Toyota Hilux Fender - Front", price:75000, img:"https://images.unsplash.com/photo-1550355291-bbee04a92027?w=400", supplier:"Mile 17 Body Works", location:"Mile 17", sales:78, video:"no"},
];

let cart = [];
function render(list){
 let g=document.getElementById('productGrid'); g.innerHTML="";
 list.forEach(p=>{
  g.innerHTML+=`
  <div onclick="openDetail(${p.id})" class="bg-white rounded-xl overflow-hidden shadow-sm">
    <img src="${p.img}" class="h-32 w-full object-cover">
    <div class="p-2">
      <p class="text-[10px] bg-orange-100 text-orange-600 px-2 py-1 rounded-full inline-block">${p.supplier}</p>
      <p class="font-bold text-xs mt-1 leading-tight">${p.name}</p>
      <p class="text-[10px] text-gray-500">${p.location} | ${p.sales} sold | ${p.video=='yes'?'📹 Video':''}</p>
      <p class="text-[#FF6A00] font-black text-sm mt-1">${p.price.toLocaleString()} FCFA</p>
      <p class="text-[9px] text-gray-400">Min Order: 1 piece | 10 pay methods</p>
    </div>
  </div>`;
 });
}
render(products);

function openDetail(id){
 let p=products.find(x=>x.id==id);
 document.getElementById('detailBox').innerHTML=`
  <img src="${p.img}" class="w-full h-80 object-cover">
  <div class="p-4">
    <p class="text-xs bg-gray-100 px-2 py-1 rounded-full inline-block">${p.supplier} - Verified Supplier - ${p.location}</p>
    <h1 class="text-xl font-black mt-2">${p.name}</h1>
    <p class="text-sm text-gray-500">4 Garages in Buea | Mount Fako View | MTN MoMo Shop Nearby</p>
    <p class="text-3xl font-black text-[#FF6A00] mt-2">${p.price.toLocaleString()} FCFA</p>

    <!-- FRONT / BACK / INSIDE / LIGHTS / START -->
    <div class="flex gap-2 mt-3 text-xs overflow-x-auto">
      <span class="bg-black text-white px-3 py-1 rounded-full">Front</span>
      <span class="bg-gray-200 px-3 py-1 rounded-full">Backside</span>
      <span class="bg-gray-200 px-3 py-1 rounded-full">Inside</span>
      <span class="bg-gray-200 px-3 py-1 rounded-full">Lights On</span>
      <span class="bg-gray-200 px-3 py-1 rounded-full">Engine Start</span>
      <span class="bg-gray-200 px-3 py-1 rounded-full">How it Runs</span>
    </div>

    <!-- VIDEO LIKE ALIBABA SUPPLIER VIDEO -->
    <div class="mt-4 bg-black rounded-xl p-2">
      <p class="text-white text-xs font-bold">📹 Supplier Video - Showing ${p.name} - How it works</p>
      <video controls class="w-full rounded-xl mt-2"><source src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
      <p class="text-[10px] text-gray-400 mt-1">Recorded at ${p.location} Garage, Buea - You can see front, back, inside, lights, engine start</p>
    </div>

    <!-- DOCUMENTS FOR CARS -->
    <div class="mt-4 grid grid-cols-2 gap-2 text-xs">
      <div class="bg-gray-50 p-3 rounded-xl"><b>Documents</b><br>✅ Carte Grise<br>✅ Visite Technique<br>✅ Dédouané<br>✅ Customs Paper</div>
      <div class="bg-gray-50 p-3 rounded-xl"><b>Supplier Guarantee</b><br>✅ 7 Days Return<br>✅ Delivery to Douala, Limbe<br>✅ 4 Garages to Confirm</div>
    </div>

    <!-- ADD TO CART - ALIBABA STYLE -->
    <div class="mt-6 flex gap-2">
      <button onclick="addToCart(${p.id})" class="flex-1 bg-[#FFD814] text-black py-4 rounded-full font-black">Add to Cart</button>
      <button onclick="buyNow(${p.id})" class="flex-1 bg-[#FF6A00] text-white py-4 rounded-full font-black">Buy Now - 10 Pay Methods</button>
    </div>
    <p class="text-[10px] text-center mt-2 text-gray-500">🔗 Share link of this product - Anyone can buy - You get commission (Rejoin)</p>
  </div>
 `;
 document.getElementById('detail').classList.remove('hidden');
}
function closeDetail(){ document.getElementById('detail').classList.add('hidden'); }
function addToCart(id){
 let p=products.find(x=>x.id==id); cart.push(p);
 document.getElementById('cartCount').innerText=cart.length;
 let total=cart.reduce((s,x)=>s+x.price,0);
 document.getElementById('cartTotal').innerText=total.toLocaleString()+' FCFA';
 document.getElementById('cartBar').classList.remove('hidden');
 alert('Added to cart! Like Alibaba - Continue shopping');
}
function buyNow(id){ addToCart(id); openCheckout(); }

function openCheckout(){
 let methods=`1. MTN MoMo\n2. Orange Money\n3. Express Union\n4. Bank Transfer\n5. PayPal\n6. Visa Card\n7. Moov Money\n8. Wave\n9. USDT Crypto\n10. Cash at Garage - Molyko`;
 let m=prompt('CHOOSE PAYMENT METHOD:\n\n'+methods+'\n\nType number 1-10');
 if(m){
  let name=prompt('Enter your name for deposit');
  let trans=prompt('Enter Transaction ID after paying');
  // Save to Firebase / localStorage
  let orders=JSON.parse(localStorage.getItem('orders')||'[]'); orders.push({items:cart, method:m, name:name, trans:trans, date:new Date().toLocaleString()}); localStorage.setItem('orders', JSON.stringify(orders));
  alert('ORDER SUCCESS! Deposit saved. We will deliver to Buea/Douala. Check FUNDS page.');
  cart=[]; document.getElementById('cartBar').classList.add('hidden');
 }
}
function searchAll(){ let q=document.getElementById('search').value.toLowerCase(); render(products.filter(p=>p.name.toLowerCase().includes(q) || p.supplier.toLowerCase().includes(q))); }
function filterCat(cat){ if(cat=='all') render(products); else render(products.filter(p=>p.cat==cat || p.name.toLowerCase().includes(cat))); }
function showHome(){ render(products); }
function openFunds(){ let orders=JSON.parse(localStorage.getItem('orders')||'[]'); alert('FUNDS PAGE\n\nTotal Orders: '+orders.length+'\n\nLast order: '+(orders[orders.length-1]?.trans||'none')+'\n\nThis will connect to Firebase so you see all funds online'); }
function openDeposit(){ alert('DEPOSIT PAGE - 10 methods\n\n'+'1.MTN 2.Orange 3.Express Union 4.Bank 5.PayPal 6.Visa 7.Moov 8.Wave 9.USDT 10.Cash at Molyko Garage'); }
function openRejoin(){ let link=window.location.href; navigator.clipboard.writeText(link); alert('REJOIN / REFERRAL\n\nYour share link copied:\n'+link+'\n\nAnyone who buys from your link, you get 10% - Like Alibaba affiliate'); }
function openMe(){ alert('ME PAGE - Your Store\n\nYou have 4 garages\nMolyko | Checkpoint | Mile 17 | Soppo\n\nTotal products: 10,000 (will load from Google Sheet)'); }

// GOOGLE CONNECTION - Sitemap ready
</script>
</body>
</html>
