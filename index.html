<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamInvest Hub</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0f1e;color:#fff;padding:15px}
.card{background:#1a233d;padding:20px;border-radius:15px;margin:12px 0}
input,button{width:100%;padding:15px;margin:8px 0;border-radius:10px;border:0;font-size:16px}
button{background:#00ff88;color:#000;font-weight:bold}
.balance{font-size:36px;color:#00ff88;text-align:center;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#00ff88;text-align:center">CamInvest Hub - FULL ACCESS</h2>
<p style="text-align:center;opacity:.7">Invest & Earn 10% Daily</p>
<input id="phone" placeholder="Your Phone Number e.g 678657567">
<div class="balance"><span id="bal">0</span> FCFA</div>
</div>

<div class="card">
<h3>Deposit - Instant Credit</h3>
<input id="depAmount" type="number" placeholder="Amount Min 500">
<button onclick="doDeposit()">DEPOSIT NOW - INSTANT</button>
</div>

<div class="card">
<h3>Withdraw - Fast Payout</h3>
<input id="withAmount" type="number" placeholder="Amount to withdraw">
<input id="withPhone" placeholder="MoMo Number to receive">
<button onclick="doWithdraw()" style="background:#fff">WITHDRAW NOW</button>
</div>

<div class="card"><h3>History</h3><div id="history">No history</div></div>

<script>
const firebaseConfig = {
  apiKey: "PASTE_YOUR_APIKEY_HERE",
  authDomain: "caminvest-hub-14129.firebaseapp.com",
  projectId: "caminvest-hub-14129",
  storageBucket: "caminvest-hub-14129.firebasestorage.app",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let currentPhone = localStorage.getItem('ci_phone') || '';
document.getElementById('phone').value = currentPhone;
if(currentPhone) loadBalance();

async function doDeposit(){
  const phone=document.getElementById('phone').value.trim();
  const amount=parseInt(document.getElementById('depAmount').value);
  if(!phone) return alert('Enter phone');
  if(!amount || amount<500) return alert('Min 500F');
  localStorage.setItem('ci_phone',phone);
  
  // Save user
  await db.collection('users').doc(phone).set({
    phone: phone,
    balance: firebase.firestore.FieldValue.increment(amount),
    lastUpdate: Date.now()
  }, {merge:true});
  
  await db.collection('deposits').add({
    phone, amount, status:'approved', time:Date.now()
  });
  
  alert(amount+'F Deposited! Instant credit!');
  loadBalance();
}

async function doWithdraw(){
  const phone=document.getElementById('phone').value.trim();
  const amount=parseInt(document.getElementById('withAmount').value);
  const momo=document.getElementById('withPhone').value.trim();
  if(!phone||!amount||!momo) return alert('Fill all');
  
  const doc=await db.collection('users').doc(phone).get();
  const bal=doc.exists ? (doc.data().balance||0) : 0;
  if(bal < amount) return alert('Low balance: '+bal+'F');
  
  await db.collection('users').doc(phone).set({
    balance: firebase.firestore.FieldValue.increment(-amount)
  }, {merge:true});
  
  await db.collection('withdrawals').add({
    phone, amount, momo, status:'pending', time:Date.now()
  });
  
  alert('Withdraw '+amount+'F to '+momo+' requested! You will be paid soon!');
  loadBalance();
}

async function loadBalance(){
  const phone=document.getElementById('phone').value.trim() || currentPhone;
  if(!phone) return;
  const doc=await db.collection('users').doc(phone).get();
  if(doc.exists){
    document.getElementById('bal').innerText=doc.data().balance||0;
    document.getElementById('withPhone').value=phone;
  }
  const snap=await db.collection('deposits').where('phone','==',phone).orderBy('time','desc').limit(10).get();
  let h=''; snap.forEach(d=>{ h+=`<div style="padding:8px;border-bottom:1px solid #222">${d.data().amount}F - OK</div>` });
  if(h) document.getElementById('history').innerHTML=h;
}

document.getElementById('phone').addEventListener('change', loadBalance);
</script>
</body>
</html>
