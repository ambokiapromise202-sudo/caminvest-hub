<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamInvest Hub</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0f1e;color:#fff;padding:15px}
.card{background:#1a233d;padding:20px;border-radius:15px;margin:12px 0;border:1px solid #2a3a5a}
input,select,button{width:100%;padding:15px;margin:8px 0;border-radius:10px;border:0;font-size:16px}
button{background:#00ff88;color:#000;font-weight:bold;cursor:pointer}
.balance{font-size:36px;color:#00ff88;font-weight:bold;text-align:center;margin:10px}
.row{display:flex;gap:10px}.row button{flex:1}
.hidden{display:none}
h2{color:#00ff88;text-align:center}
#msg{color:#ff6666;text-align:center;margin-top:10px;min-height:20px}
</style>
</head>
<body>

<div id="auth">
  <div class="card">
    <h2>CamInvest Hub</h2>
    <p style="text-align:center;opacity:.6;margin-bottom:10px">Invest & Earn 10% Daily</p>
    <input id="name" placeholder="Full Name e.g Sean Morgan">
    <input id="phone" type="tel" placeholder="Phone e.g 678657567">
    <input id="password" type="password" placeholder="Password min 6 chars">
    <button onclick="signup()">CREATE ACCOUNT</button>
    <button onclick="login()" style="background:#2a3a5a;color:#fff">LOGIN WITH PHONE</button>
    <p id="msg"></p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="card">
    <p>Hi, <b id="userName"></b></p>
    <p style="opacity:.7" id="userPhone"></p>
    <div class="balance"><span id="bal">0</span> FCFA</div>
    <p style="text-align:center;opacity:.7">Balance - Withdraw anytime</p>
    <div class="row">
      <button onclick="showBox('deposit')">DEPOSIT</button>
      <button onclick="showBox('withdraw')" style="background:#fff">WITHDRAW</button>
    </div>
    <button onclick="logout()" style="background:#111;color:#888;margin-top:10px">Logout</button>
  </div>

  <div id="deposit" class="card hidden">
    <h3>Deposit</h3>
    <input id="depAmount" type="number" placeholder="Amount Min 500">
    <select id="depMethod"><option>MTN MoMo</option><option>Orange Money</option></select>
    <div style="background:#000;padding:12px;border-radius:8px;margin:8px 0">
      Send To: <b style="color:#00ff88">650000000</b><br>Name: Ambokia Promise
    </div>
    <button onclick="doDeposit()">I HAVE SENT - ADD MONEY</button>
    <button onclick="hideBoxes()" style="background:#333;color:#fff">Cancel</button>
  </div>

  <div id="withdraw" class="card hidden">
    <h3>Withdraw</h3>
    <input id="withAmount" type="number" placeholder="Amount">
    <input id="withPhone" placeholder="MoMo Number to receive">
    <button onclick="doWithdraw()">REQUEST WITHDRAWAL</button>
    <button onclick="hideBoxes()" style="background:#333;color:#fff">Cancel</button>
  </div>

  <div class="card">
    <h3>History</h3>
    <div id="history">No history</div>
  </div>
</div>

<script>
// ====== YOUR FIREBASE CONFIG - PASTE FROM SCREENSHOT HERE ======
const firebaseConfig = {
  apiKey: "AIzaSyBqF6o6wX1yY...PASTE YOUR REAL KEY FROM IMAGE",
  authDomain: "caminvest-hub-14129.firebaseapp.com",
  projectId: "caminvest-hub-14129",
  storageBucket: "caminvest-hub-14129.firebasestorage.app",
  messagingSenderId: "PASTE FROM IMAGE",
  appId: "PASTE FROM IMAGE"
};
// ================================================================
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

function phoneToEmail(p){ return p.replace(/\D/g,'')+"@caminvest.com"; }
function showBox(id){ hideBoxes(); document.getElementById(id).classList.remove('hidden'); }
function hideBoxes(){ document.getElementById('deposit').classList.add('hidden'); document.getElementById('withdraw').classList.add('hidden'); }
function setMsg(t){ document.getElementById('msg').innerText=t; }

auth.onAuthStateChanged(async user=>{
  if(!user){
    document.getElementById('auth').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    return;
  }
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const doc=await db.collection('users').doc(user.uid).get();
  if(doc.exists){
    const d=doc.data();
    document.getElementById('userName').innerText=d.name;
    document.getElementById('userPhone').innerText=d.phone;
    document.getElementById('bal').innerText=d.balance||0;
    document.getElementById('withPhone').value=d.phone;
  }
  loadHistory(user.uid);
});

async function signup(){
  try{
    const name=document.getElementById('name').value.trim();
    const phone=document.getElementById('phone').value.trim();
    const pass=document.getElementById('password').value.trim();
    if(!name||!phone||!pass) return setMsg('Fill all fields');
    if(pass.length<6) return setMsg('Password must be 6+ characters');
    setMsg('Creating...');
    const email=phoneToEmail(phone);
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    await db.collection('users').doc(cred.user.uid).set({name,phone,email,balance:0,created:Date.now()});
    setMsg('Account created! Loading...');
  }catch(e){
    console.log(e);
    if(e.code==='auth/email-already-in-use') setMsg('Phone already used - Click LOGIN WITH PHONE');
    else if(e.code==='auth/invalid-api-key') setMsg('ERROR: Firebase config is wrong! Paste real config');
    else setMsg(e.message);
  }
}

async function login(){
  try{
    const phone=document.getElementById('phone').value.trim();
    const pass=document.getElementById('password').value.trim();
    if(!phone||!pass) return setMsg('Enter phone and password');
    setMsg('Logging in...');
    const email=phoneToEmail(phone);
    await auth.signInWithEmailAndPassword(email,pass);
  }catch(e){ setMsg('Wrong phone or password - Try CREATE first'); }
}

function logout(){ auth.signOut(); }

async function doDeposit(){
  const amount=parseInt(document.getElementById('depAmount').value);
  if(!amount||amount<500) return alert('Min 500F');
  const user=auth.currentUser;
  await db.collection('deposits').add({userId:user.uid,amount,status:'approved',time:Date.now()});
  await db.collection('users').doc(user.uid).update({balance: firebase.firestore.FieldValue.increment(amount)});
  alert(amount+'F Added!'); location.reload();
}

async function doWithdraw(){
  const amount=parseInt(document.getElementById('withAmount').value);
  const momo=document.getElementById('withPhone').value.trim();
  if(!amount||!momo) return alert('Fill amount and MoMo');
  const user=auth.currentUser;
  const snap=await db.collection('users').doc(user.uid).get();
  if((snap.data().balance||0)<amount) return alert('Low balance');
  await db.collection('withdrawals').add({userId:user.uid,amount,phone:momo,status:'pending',time:Date.now()});
  await db.collection('users').doc(user.uid).update({balance: firebase.firestore.FieldValue.increment(-amount)});
  alert('Withdraw request sent to '+momo); location.reload();
}

async function loadHistory(uid){
  const snap=await db.collection('deposits').where('userId','==',uid).orderBy('time','desc').limit(20).get();
  let h=''; snap.forEach(d=>{ h+=`<div style="padding:8px;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>${d.data().amount}F</span><span style="color:#00ff88">OK</span></div>` });
  if(h) document.getElementById('history').innerHTML=h;
}
</script>
</body>
</html>
