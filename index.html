<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CamInvest - Sean Morgan</title><script src="https://cdn.tailwindcss.com"></script></head><body style="background:#f5f7fb;padding-bottom:90px"><div style="background:linear-gradient(to right,#000,#ff0050);color:white;padding:16px"><h1 style="font-weight:bold">CamInvest Hub 🇨🇲</h1><p style="font-size:13px">Sean Morgan @ambokiapromise792</p><div style="background:rgba(255,255,255,.2);border-radius:12px;padding:12px;margin-top:10px;display:flex;justify-content:space-between"><div><p style="font-size:11px">Balance</p><b id="bal">XAF 105</b></div><div><p style="font-size:11px">Done</p><b id="done">0/10</b></div></div></div><div style="padding:16px"><div id="list"></div></div><button id="wdBtn" style="position:fixed;bottom:20px;right:16px;left:16px;background:#16a34a;color:white;padding:14px;border-radius:30px;font-weight:bold">💸 Withdraw to MTN MoMo - Min 100F</button><div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center;padding:16px"><div style="background:white;border-radius:16px;padding:20px;width:100%;max-width:380px"><h2 style="font-weight:bold">Withdraw</h2><input id="num" placeholder="MoMo 678657567" style="width:100%;border:1px solid #ddd;padding:12px;border-radius:10px;margin-top:12px"><select id="type" style="width:100%;border:1px solid #ddd;padding:12px;border-radius:10px;margin-top:8px"><option>MTN MoMo</option><option>Orange Money</option></select><input id="amt" type="number" placeholder="100" style="width:100%;border:1px solid #ddd;padding:12px;border-radius:10px;margin-top:8px"><button id="sendWd" style="background:#16a34a;color:white;width:100%;padding:12px;border-radius:10px;margin-top:12px;font-weight:bold">Send Request</button><button onclick="document.getElementById('modal').style.display='none'" style="background:#eee;width:100%;padding:10px;border-radius:10px;margin-top:8px">Cancel</button></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getFirestore,collection,addDoc}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyBhMWKR7UBD4zaXCCn08WLeOrD2yvWlicY",authDomain:"caminvest-hub-14129.firebaseapp.com",projectId:"caminvest-hub-14129",storageBucket:"caminvest-hub-14129.firebasestorage.app",messagingSenderId:"992533738944",appId:"1:992533738944:web:9776d1a82b840f33378425"};const app=initializeApp(firebaseConfig);const db=getFirestore(app);const tiktok="https://vm.tiktok.com/ZS9BbLLrWKNaH-MGPcs/";const list=document.getElementById('list');let c=0;for(let i=1;i<=10;i++){let d=document.createElement('div');d.style.cssText="background:white;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)";d.innerHTML=`<b>Task ${i}: Watch Sean</b><div style="background:black;border-radius:12px;margin-top:8px;padding:24px;text-align:center;color:white"><a href="${tiktok}" target="_blank" style="background:#ff0050;color:white;padding:8px 16px;border-radius:8px;display:inline-block;text-decoration:none">▶️ Open TikTok</a></div><button class="claimBtn" style="background:#ff0050;color:white;width:100%;padding:12px;border-radius:10px;margin-top:10px;font-weight:bold;border:none">Watch 30s & Claim 10.5 XAF</button>`;list.appendChild(d);}list.addEventListener('click',e=>{if(!e.target.classList.contains('claimBtn'))return;let btn=e.target,s=30;btn.disabled=true;let iv=setInterval(()=>{s--;btn.innerText=`Watching... ${s}s`;if(s<=0){clearInterval(iv);btn.innerText="✅ Claimed +10.5 XAF";btn.style.background="#16a34a";c++;document.getElementById('done').innerText=c+"/10";let b=parseFloat(document.getElementById('bal').innerText.replace(/[^0-9.]/g,''));document.getElementById('bal').innerText="XAF "+(b+10.5);}},1000);window.open(tiktok,"_blank");});document.getElementById('wdBtn').onclick=()=>{document.getElementById('modal').style.display='flex'};document.getElementById('sendWd').onclick=async()=>{let num=document.getElementById('num').value,amt=document.getElementById('amt').value,type=document.getElementById('type').value;if(!num||!amt){alert("Enter number & amount");return;}if(amt<100){alert("Min 100");return;}try{await addDoc(collection(db,"withdrawals"),{phone:num,amount:Number(amt),method:type,status:"pending",createdAt:new Date()});alert(`✅ Sent! ${type} ${num} ${amt}F - Check admin.html`);document.getElementById('modal').style.display='none';}catch(e){alert("Create Firestore Database in Firebase first! Error: "+e.message);}};</script></body></html>
