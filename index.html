<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My 4 SIMs Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4">
<h1 class="text-2xl font-bold">My 4 MTN/Orange SIMs</h1>
<p class="text-white/50 text-sm">Legal Dashboard - You control with your PIN</p>

<div id="sims" class="grid gap-4 mt-6"></div>

<div class="mt-8 bg-[#1a1a1a] p-4 rounded-xl">
<h3 class="font-bold">Add Money Entry</h3>
<select id="simSelect" class="w-full mt-2 p-3 bg-black rounded text-white">
<option value="0">MTN SIM 1 - 67X</option>
<option value="1">MTN SIM 2 - 68X</option>
<option value="2">Orange SIM 1 - 69X</option>
<option value="3">Orange SIM 2 - 65X</option>
</select>
<input id="amount" type="number" placeholder="Amount e.g. 5000" class="w-full mt-2 p-3 bg-black rounded" />
<button onclick="addMoney()" class="w-full mt-3 bg-yellow-500 text-black p-3 rounded font-bold">Add Entry</button>
</div>

<div class="mt-4 bg-[#1a1a1a] p-4 rounded-xl">
<h3 class="font-bold">Withdraw (Requires Your PIN on Phone)</h3>
<input id="withdrawPhone" placeholder="Send to +237..." class="w-full mt-2 p-3 bg-black rounded" />
<input id="withdrawAmount" type="number" placeholder="Amount" class="w-full mt-2 p-3 bg-black rounded" />
<button onclick="withdraw()" class="w-full mt-3 border-yellow-500 text-yellow-500 p-3 rounded font-bold">Request Withdraw - Confirm with PIN</button>
<p class="text-xs text-white/30 mt-2">You will receive USSD *126# to enter PIN. We never bypass PIN.</p>
</div>
